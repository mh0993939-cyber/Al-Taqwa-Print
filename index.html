<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>التقوى للطباعة الحرارية وحفر الليزر</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl flex flex-col items-center text-center">
    
    <!-- الشعار / الأيقونة -->
    <div class="w-20 h-20 rounded-2xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center mb-4 text-amber-400 text-3xl shadow-lg shadow-amber-500/10">
      <i class="fa-solid fa-gem"></i>
    </div>

    <h1 class="text-2xl font-black text-white mb-1">التقوى للطباعة والليزر</h1>
    <p class="text-amber-400 text-sm font-semibold mb-3">طباعة حرارية • حفر ليزر مخصص • هدايا ودعاية</p>
    <p class="text-slate-400 text-xs sm:text-sm mb-6 leading-relaxed">
      تواصل معنا مباشرة عبر الحسابات والأرقام التالية لطلب خدمات الطباعة والتصميم:
    </p>

    <!-- الروابط -->
    <div class="w-full space-y-3">
      
      <!-- واتساب (استبدل الرقم برقمك بصيغة دولية مثلاً 201xxxxxxxxx) -->
      <a href="https://wa.me/201000000000" target="_blank" class="flex items-center justify-between p-3.5 bg-slate-800/80 hover:bg-slate-800 border border-slate-700/60 hover:border-emerald-500 rounded-2xl transition group">
        <div class="flex items-center gap-3">
          <i class="fa-brands fa-whatsapp text-2xl text-emerald-400"></i>
          <span class="font-bold text-sm text-slate-200 group-hover:text-white">واتساب للطلبات والاستفسار</span>
        </div>
        <i class="fa-solid fa-chevron-left text-xs text-slate-500 group-hover:text-emerald-400"></i>
      </a>

      <!-- فيسبوك -->
      <a href="https://facebook.com" target="_blank" class="flex items-center justify-between p-3.5 bg-slate-800/80 hover:bg-slate-800 border border-slate-700/60 hover:border-blue-500 rounded-2xl transition group">
        <div class="flex items-center gap-3">
          <i class="fa-brands fa-facebook text-2xl text-blue-500"></i>
          <span class="font-bold text-sm text-slate-200 group-hover:text-white">صفحة الفيسبوك</span>
        </div>
        <i class="fa-solid fa-chevron-left text-xs text-slate-500 group-hover:text-blue-400"></i>
      </a>

      <!-- اتصال هاتفي مباشر -->
      <a href="tel:01000000000" class="flex items-center justify-between p-3.5 bg-slate-800/80 hover:bg-slate-800 border border-slate-700/60 hover:border-amber-500 rounded-2xl transition group">
        <div class="flex items-center gap-3">
          <i class="fa-solid fa-phone text-xl text-amber-400"></i>
          <span class="font-bold text-sm text-slate-200 group-hover:text-white">اتصال هاتفي مباشر</span>
        </div>
        <i class="fa-solid fa-chevron-left text-xs text-slate-500 group-hover:text-amber-400"></i>
      </a>

    </div>

    <footer class="mt-8 text-xs text-slate-500">
      جميع الحقوق محفوظة &copy; التقوى
    </footer>
  </div>

</body>
</html>
